name: Legacy PSP baseline
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: legacy-baseline-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make -C revival test
  legacy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record environment and compile
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > baseline.log
          docker pull pspdev/pspdev:latest >> baseline.log 2>&1
          docker image inspect --format '{{index .RepoDigests 0}}' pspdev/pspdev:latest >> baseline.log
          docker run --rm -v "$PWD:/src" -w /src pspdev/pspdev:latest sh -c 'set -e; psp-gcc --version; psp-config --pspsdk-path; make -k -f makefile; test -s EBOOT.PBP' 2>&1 | tee -a baseline.log
      - name: Upload diagnostic log (not binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-build-log
          path: baseline.log
          if-no-files-found: warn
  source-sdl-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build pinned SDL source and link diagnostic emulator
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD > source-sdl.log
          docker pull pspdev/pspdev:latest >> source-sdl.log 2>&1
          docker image inspect --format '{{index .RepoDigests 0}}' pspdev/pspdev:latest >> source-sdl.log
          docker run --rm -v "$PWD:/src" -w /src pspdev/pspdev:latest sh -c 'set -e; apk add --no-cache autoconf automake libtool build-base; sh revival/build-source-sdl.sh; make -f makefile SDL_PREFIX=/tmp/psxprv-sdl SDL_MIXER=0; test -s EBOOT.PBP; psp-nm PSXP.elf > source-sdl-symbols.txt; sha256sum EBOOT.PBP; make -f makefile clean; make -f makefile SDL_PREFIX=/tmp/psxprv-sdl SDL_MIXER=0 REVIVAL_OPT=-O2; test -s EBOOT.PBP; sha256sum EBOOT.PBP' 2>&1 | tee -a source-sdl.log
      - name: Upload source build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-sdl-diagnostics
          path: |
            source-sdl.log
            source-sdl-symbols.txt
          if-no-files-found: warn
